<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Parfums</title>

<style>
/* GLOBAL */
body {
  margin: 0;
  font-family: Arial;
  background: #0d0d0d;
  color: white;
}

/* HEADER */
header {
  background: #0d0d0d;
  color: white;
  padding: 15px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid #d4af37;
}

nav a {
  color: #d4af37;
  margin: 0 15px;
  text-decoration: none;
  font-weight: bold;
}

nav a:hover {
  color: white;
}

/* PANIER ICON (inutile mais je ne supprime rien) */
.cart-icon {
  cursor: pointer;
  font-size: 18px;
  background: #d4af37;
  padding: 8px 15px;
  border-radius: 5px;
  color: black;
  font-weight: bold;
}

/* TITRE */
h2 {
  color: #d4af37;
  text-align: center;
  margin-top: 20px;
}

/* PRODUITS */
.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  padding: 30px;
}

.product {
  background: #111;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
  border: 1px solid #d4af37;
  transition: transform 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease;
}

.product:hover {
  transform: scale(1.08);
  border-color: #b8962f;
  box-shadow: 0 0 25px rgba(212, 175, 55, 0.6);
}

.product img {
  width: 100%;
  border-radius: 10px;
}

/* BOUTONS */
button {
  background: #d4af37;
  border: none;
  padding: 10px;
  width: 100%;
  margin-top: 10px;
  cursor: pointer;
  border-radius: 5px;
  font-weight: bold;
  color: black;
}

button:hover {
  background: #b8962f;
}

/* MODALS */
.modal {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.7);
}

.modal-content {
  background: #111;
  width: 350px;
  margin: 80px auto;
  padding: 20px;
  border-radius: 10px;
  border: 2px solid #d4af37;
  color: white;
}

input, textarea {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
  border-radius: 5px;
  border: 1px solid #d4af37;
  background: #0d0d0d;
  color: white;
}

/* RESPONSIVE */
@media (max-width: 768px) {
  header {
    flex-direction: column;
    text-align: center;
  }
  nav a {
    display: inline-block;
    margin: 10px;
  }
  .modal-content {
    width: 90%;
  }
}
</style>

</head>
<body>

<header>
  <div>
    <a href="index.html">Accueil</a>
    <a href="parfums.html">Parfums</a>
    
  </div>

  
</header>

<h2>Nos Parfums</h2>

<section class="products" id="productList"></section>

<!-- FORMULAIRE LIVRAISON -->
<div id="deliveryModal" class="modal">
  <div class="modal-content">
    <h3>Informations de livraison</h3>

    <input id="clientName" placeholder="Nom complet">
    <input id="clientPhone" placeholder="Téléphone">
    <textarea id="clientAddress" placeholder="Adresse complète"></textarea>

    <button onclick="sendOrder()">Envoyer la commande</button>
    <button onclick="closeDelivery()">Annuler</button>
  </div>
</div>

<script>
const products = [
  { id: 1, name: "KALY", price: 10000, img:"images/KALY.jpeg" },
  { id: 2, name: "his confession", price: 10000, img: "images/his confession.jpeg" },
  { id: 3, name: "Intense Man", price: 15000, img: "images/Intense Man.jpeg" },
  { id: 4, name: "Stronger with YOU", price: 9000, img: "images/Stronger with YOU.jpeg" },
  { id: 5, name: "The One", price: 8000, img: "images/the One.jpeg" },
  { id: 6, name: "VALENTINO", price: 10000, img: "images/VALENTINO.jpeg" },
  { id: 7, name: "LIBRE", price: 7000, img: "images/LIBRE.jpeg" },
  { id: 8, name: "MOSUF", price: 5000, img: "images/MOSUF.jpeg" },
  { id: 9, name: "Victoria's secret", price: 10000, img: "images/Victoria's secret.jpeg" },
  { id: 10, name: "GREEN", price: 25000, img: "images/GREEN.jpeg" },
];

let selectedProduct = null;

// Affichage des produits
const productList = document.getElementById("productList");
products.forEach(p => {
  productList.innerHTML += `
    <div class="product">
      <img src="${p.img}">
      <h3>${p.name}</h3>
      <p>${p.price} FRCFA</p>
      <button onclick="buyNow(${p.id})">Acheter</button>
    </div>
  `;
});

// Quand on clique sur ACHETER
function buyNow(id) {
  selectedProduct = products.find(p => p.id === id);
  document.getElementById("deliveryModal").style.display = "block";
}

// Fermer formulaire
function closeDelivery() {
  document.getElementById("deliveryModal").style.display = "none";
}

// Envoyer la commande WhatsApp
function sendOrder() {
  let name = clientName.value;
  let phone = clientPhone.value;
  let address = clientAddress.value;

  if (!name || !phone || !address) {
    alert("Veuillez remplir toutes les informations.");
    return;
  }

  let message =
    "🛒 *Nouvelle commande* \n\n" +
    `📦 *Produit :* ${selectedProduct.name}\n` +
    `💰 *Prix :* ${selectedProduct.price} FRCFA\n\n` +
    `🖼️ *Photo :* ${selectedProduct.img}\n\n` +
    `👤 *Nom :* ${name}\n` +
    `📞 *Téléphone :* ${phone}\n` +
    `📍 *Adresse :* ${address}`;

  let adminPhone = "2250779440910";

  let url = `https://wa.me/${adminPhone}?text=${encodeURIComponent(message)}`;
  window.open(url, "_blank");

  closeDelivery();
}
</script>

</body>
</html>

<script>

// URL de ton backend Laravel (Render)
const API_URL = "https://mon-parfum-1.onrender.com/api/parfums";

// Produit sélectionné
let selectedProduct = null;

// Charger les parfums depuis Laravel
fetch(API_URL)
  .then(response => response.json())
  .then(products => {
    const productList = document.getElementById("productList");
    productList.innerHTML = "";

    products.forEach(p => {
      productList.innerHTML += `
        <div class="product">
          <img src="https://mon-parfum-1.onrender.com/storage/${p.image}">
          <h3>${p.nom}</h3>
          <p>${p.prix} FRCFA</p>
          <button onclick="buyNow(${p.id}, '${p.nom}', ${p.prix}, '${p.image}')">Acheter</button>
        </div>
      `;
    });
  })
  .catch(error => {
    console.error("Erreur API :", error);
  });


// Quand on clique sur ACHETER
function buyNow(id, name, price, img) {
  selectedProduct = { id, name, price, img };
  document.getElementById("deliveryModal").style.display = "block";
}

// Fermer formulaire
function closeDelivery() {
  document.getElementById("deliveryModal").style.display = "none";
}

// Envoyer la commande WhatsApp
function sendOrder() {
  let name = clientName.value;
  let phone = clientPhone.value;
  let address = clientAddress.value;

  if (!name || !phone || !address) {
    alert("Veuillez remplir toutes les informations.");
    return;
  }

  let message =
    "🛒 *Nouvelle commande* \n\n" +
    `📦 *Produit :* ${selectedProduct.name}\n` +
    `💰 *Prix :* ${selectedProduct.price} FRCFA\n\n` +
    `🖼️ *Photo :* https://mon-parfum-1.onrender.com/storage/${selectedProduct.img}\n\n` +
    `👤 *Nom :* ${name}\n` +
    `📞 *Téléphone :* ${phone}\n` +
    `📍 *Adresse :* ${address}`;

  let adminPhone = "2250779440910";

  let url = `https://wa.me/${adminPhone}?text=${encodeURIComponent(message)}`;
  window.open(url, "_blank");

  closeDelivery();
}

</script>
